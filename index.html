<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Judiciary Explorer Pro - Class 8 Civics</title>
  <meta name="description" content="Judiciary Explorer Pro is an interactive Class 8 Civics learning website covering the Indian Judiciary, court hierarchy, independent judiciary, civil and criminal law, PIL, fundamental rights and quizzes.">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#657087;--accent:#304fc9;--soft:#e9edff;--border:#dfe4ef;--good:#e9f7ef}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5} .wrap{max-width:1100px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center} h1{margin:0;font-size:24px} .muted{color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap} .pill{background:var(--soft);border-radius:999px;padding:8px 12px}
nav{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:14px} button{font:inherit;cursor:pointer}
.nav,.btn,.answer{background:white;border:1px solid var(--border);border-radius:12px;padding:10px} .nav.active,.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1100px;margin:20px auto;padding:0 16px 50px} .hero,.card,.callout{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px} .dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card h3{margin:8px 0} p{line-height:1.55} .callout{background:var(--soft);margin-top:14px}
.lesson{text-align:left} .court{max-width:700px;margin:10px auto;text-align:center} .arrow{text-align:center;font-size:26px}
.answer{display:block;width:100%;text-align:left;margin:8px 0} .correct{background:var(--good);border-color:#4d9b72}
.progress{height:10px;background:#e7eaf1;border-radius:20px;overflow:hidden;margin-top:12px} .progress div{height:100%;background:var(--accent);width:0}
table{width:100%;border-collapse:collapse;background:white} th,td{border:1px solid var(--border);padding:10px;text-align:left} th{background:var(--soft)}
@media(max-width:760px){nav{grid-template-columns:repeat(3,1fr)}.grid,.dashboard{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<header><div class="wrap"><div class="top"><div><h1>⚖️ Judiciary Explorer Pro</h1><div class="muted">Class 8 Civics • Detailed Digital Chapter • Advanced Edition</div></div><div class="stats"><span class="pill">XP <b id="xp">0</b></span><span class="pill">Topics <b id="topicsDone">0</b>/18</span><span class="pill">Best Quiz <b id="best">0</b>/30</span></div></div>
<nav id="nav"></nav><div class="progress"><div id="prog"></div></div></div></header><main id="app"></main>
<script>
const DATA={"lessons": [["1. Understanding the Judiciary", "The judiciary is the branch of government made up of courts. It interprets and applies laws, settles legal disputes, protects rights, and helps ensure that government action follows the Constitution."], ["2. Why Do We Need Courts?", "Society has disagreements between individuals, groups, organisations and governments. Courts provide a legal process for resolving these disputes instead of allowing power or force to decide the outcome."], ["3. Role of the Judiciary", "Major functions include dispute resolution, protection of Fundamental Rights, interpretation of laws and the Constitution, and judicial review of laws or government action when constitutional questions arise."], ["4. Independent Judiciary", "Judicial independence means courts and judges should be able to decide cases according to the Constitution, law and evidence without improper pressure from the executive, legislature, private groups or powerful individuals."], ["5. Integrated Judicial System", "India has an integrated court structure. The Supreme Court is the apex court. High Courts operate at the State or relevant territorial level, while District and subordinate courts function below them."], ["6. Supreme Court", "The Supreme Court of India is the highest court. It is located in New Delhi. It hears matters within its constitutional jurisdiction and appeals permitted by law, and plays a major role in constitutional interpretation."], ["7. High Courts", "High Courts are the highest courts at the State or relevant territorial level. They hear cases within their jurisdiction, hear appeals, protect legal and constitutional rights, and supervise subordinate courts."], ["8. District & Subordinate Courts", "Many cases begin in courts at the district and local levels. District and subordinate courts deal with civil and criminal matters according to their jurisdiction."], ["9. Appellate System", "An appeal is a request, where law permits, for a higher court to review a decision of a lower court. This creates an important system of judicial review within the court hierarchy."], ["10. Civil Law", "Civil law generally deals with disputes concerning rights and claims between persons or organisations. Examples can include property, contracts, rent, family disputes and claims for compensation."], ["11. Criminal Law", "Criminal law deals with acts defined by law as offences. Examples include theft, robbery and assault. Criminal cases involve investigation, prosecution and a judicial process governed by law."], ["12. Civil vs Criminal Procedure", "A civil case commonly begins when an affected party brings a claim before the appropriate court. A criminal matter commonly involves an alleged offence, police investigation where applicable, prosecution and trial under criminal procedure."], ["13. Fundamental Rights & Courts", "Fundamental Rights are guaranteed by the Constitution. Courts play a crucial role in protecting them. A person can seek an appropriate constitutional remedy when a Fundamental Right is violated."], ["14. Right to Constitutional Remedies", "This right provides a constitutional route for enforcement of Fundamental Rights. The Supreme Court and High Courts have important powers to issue constitutional remedies within their respective jurisdiction."], ["15. Public Interest Litigation (PIL)", "PIL developed as a way to make access to justice easier in matters involving public interest, particularly where disadvantaged people might otherwise find it difficult to approach courts. PIL remains subject to judicial rules and scrutiny."], ["16. Access to Justice", "For justice to be meaningful, people need practical access to legal institutions. Cost, distance, awareness and social disadvantage can create barriers. Legal aid and public-interest mechanisms can help improve access."], ["17. Judicial Review", "Judicial review is the power of courts to examine laws and government actions for consistency with the Constitution. It is an important constitutional safeguard."], ["18. Rule of Law", "The rule of law means that government and citizens are governed by law. No person should be above the law merely because of wealth, status or political power."]], "quiz": [["Which institution is the apex court of India?", ["High Court", "Supreme Court", "District Court", "Parliament"], 1], ["Which statement best describes judicial independence?", ["Judges may ignore laws", "Courts decide without improper outside pressure", "Courts make every law", "Judges work under political parties"], 1], ["A disagreement about ownership of a house is most likely primarily a…", ["Criminal matter", "Civil matter", "Election offence", "Constitutional amendment"], 1], ["An alleged robbery is primarily dealt with through…", ["Criminal law", "Civil law", "Contract law only", "Family law"], 0], ["What is an appeal?", ["A new election", "A request for higher-court review where law permits", "A police complaint only", "A constitutional amendment"], 1], ["Which court level is normally below a High Court?", ["Supreme Court", "District and subordinate courts", "Parliament", "Election Commission"], 1], ["Judicial review most directly concerns…", ["Examining law/government action against the Constitution", "Collecting taxes", "Conducting elections", "Making school rules"], 0], ["PIL stands for…", ["Public Interest Litigation", "Private Indian Law", "Public Investigation Legislation", "People's Internal Law"], 0], ["Which idea best explains the rule of law?", ["Powerful people are exempt", "Government and citizens are governed by law", "Only judges must obey law", "Only criminal law matters"], 1], ["Which is NOT a core judicial function?", ["Resolving disputes", "Protecting rights", "Interpreting law", "Printing currency"], 3], ["A landlord–tenant rent dispute is generally…", ["Civil", "Criminal", "Military", "Electoral"], 0], ["Theft is generally…", ["Only a civil wrong", "A criminal offence", "A constitutional amendment", "A PIL"], 1], ["Which statement about Fundamental Rights is most accurate?", ["Courts have no role in protecting them", "Courts can provide remedies for violations within their jurisdiction", "Only Parliament can hear rights complaints", "They apply only during elections"], 1], ["The Supreme Court of India is located in…", ["Mumbai", "New Delhi", "Kolkata", "Chennai"], 1], ["High Courts primarily operate at which level?", ["Village only", "State/relevant territorial level", "International level", "School district"], 1], ["Why is an appellate structure useful?", ["It allows review of lower-court decisions where permitted", "It eliminates all lower courts", "It prevents written judgments", "It replaces the Constitution"], 0], ["Which situation is most clearly civil?", ["Assault allegation", "Robbery allegation", "Contract payment dispute", "Theft allegation"], 2], ["Which situation is most clearly criminal?", ["Property partition dispute", "Divorce petition", "Rent disagreement", "Assault allegation"], 3], ["PIL is especially associated with…", ["Public-interest issues and access to justice", "Private shopping disputes only", "Creating new states", "Conducting elections"], 0], ["An independent judiciary is important mainly because it…", ["Makes judges more powerful than the Constitution", "Supports impartial application of law", "Allows judges to join the executive", "Ends the need for Parliament"], 1], ["A court examining whether government action violates the Constitution is exercising…", ["Judicial review", "Tax collection", "Legislation", "Executive administration"], 0], ["Which sequence correctly moves upward through the broad court hierarchy?", ["Supreme → High → District", "District → High → Supreme", "High → District → Supreme", "District → Supreme → High"], 1], ["Access to justice can be affected by…", ["Cost and lack of awareness", "Only weather", "Only election dates", "Nothing outside the courtroom"], 0], ["Which statement best distinguishes civil and criminal law?", ["Civil deals mainly with private rights/claims; criminal deals with offences", "They are identical", "Civil law always means prison", "Criminal law deals only with property"], 0], ["If a citizen alleges violation of a Fundamental Right, the Constitution provides for…", ["Constitutional remedies", "No legal remedy", "Only a newspaper complaint", "Automatic criminal punishment"], 0], ["Why should judges base decisions on evidence and law?", ["To support fairness and rule of law", "To make trials longer", "To avoid giving reasons", "To follow public popularity"], 0], ["Which body is part of the judiciary?", ["Court", "Cabinet", "Legislative Assembly", "Municipal executive"], 0], ["A lower court decision can always be appealed without restriction. Is this accurate?", ["Yes, always", "No; appeals depend on law and procedure", "Only in civil cases", "Only if media approves"], 1], ["Which statement about PIL is the most careful and accurate?", ["Anyone can use it for any private dispute", "It concerns public interest and remains subject to court rules", "It replaces all normal cases", "It can only concern elections"], 1], ["What is the strongest reason courts matter in a democracy?", ["They provide legal mechanisms for resolving disputes and protecting constitutional limits", "They control every branch completely", "They replace elections", "They make all government policy"], 0]]};
let page=0,xp=0,opened=new Set(),best=0;
const labels=[["🏠","Home"],["📚","Full Chapter"],["🏛️","Court System"],["⚖️","Case Lab"],["🔍","Compare"],["📖","Glossary"],["🏆","Hard Quiz"]];
nav.innerHTML=labels.map((x,i)=>`<button class="nav" data-p="${i}">${x[0]}<br>${x[1]}</button>`).join("");
nav.onclick=e=>{let b=e.target.closest("[data-p]");if(b){page=+b.dataset.p;render()}};
function update(){xpEl=document.getElementById("xp");xpEl.textContent=xp;topicsDone.textContent=opened.size;bestEl=document.getElementById("best");bestEl.textContent=best;prog.style.width=Math.min(100,(opened.size/18*55)+(best/30*45))+"%";document.querySelectorAll(".nav").forEach((b,i)=>b.classList.toggle("active",i===page))}
function home(){return `<section class="hero"><h2>India's Judiciary — Complete Interactive Project</h2><p>This expanded project covers the full chapter through <b>18 learning modules</b>, an interactive court hierarchy, realistic classification cases, civil-vs-criminal comparison, a glossary, and a <b>30-question harder quiz</b>.</p><div class="dashboard">
<button class="card jump" data-go="1"><h3>📚 18 Lessons</h3><p>Detailed chapter notes.</p></button><button class="card jump" data-go="2"><h3>🏛️ Court Explorer</h3><p>Supreme, High and subordinate courts.</p></button><button class="card jump" data-go="3"><h3>⚖️ Case Lab</h3><p>Apply concepts to situations.</p></button><button class="card jump" data-go="6"><h3>🏆 Hard Quiz</h3><p>30 advanced questions.</p></button></div><div class="callout"><b>Learning goal:</b> Explain why an independent judiciary matters, understand India's integrated court structure, distinguish civil and criminal law, and connect courts with Fundamental Rights, PIL, access to justice and judicial review.</div></section>`}
function fullChapter(){return `<section><h2>📚 Detailed Chapter</h2><p class="muted">Open every module. Each first opening gives 5 XP.</p><div class="grid">${DATA.lessons.map((l,i)=>`<button class="card lesson" data-i="${i}"><small>MODULE ${i+1}</small><h3>${l[0]}</h3><p id="lesson${i}" hidden>${l[1]}</p></button>`).join("")}</div></section>`}
function courts(){return `<section><h2>🏛️ India's Integrated Court System</h2><p>The broad hierarchy allows many matters to begin at lower levels while higher courts exercise appellate and constitutional functions according to law.</p>
<button class="card court" data-info="The Supreme Court is India's apex court. It has important original, appellate and constitutional functions under the Constitution and laws."><h3>🇮🇳 Supreme Court of India</h3><p>Apex constitutional court • New Delhi</p></button><div class="arrow">↑ Appeal / constitutional jurisdiction</div>
<button class="card court" data-info="High Courts are the highest courts at the State or relevant territorial level. They hear appeals, exercise constitutional powers and supervise subordinate courts within their jurisdiction."><h3>🏢 High Courts</h3><p>State / relevant territorial level</p></button><div class="arrow">↑ Appeal</div>
<button class="card court" data-info="District courts and other subordinate courts handle a large volume of civil and criminal matters. Their exact powers depend on law and jurisdiction."><h3>🏛️ District & Subordinate Courts</h3><p>District and local levels</p></button>
<div id="courtInfo" class="callout">Tap a court to inspect its role.</div><div class="callout"><b>Important:</b> The exact path of a case depends on subject matter, jurisdiction and procedural law. Not every decision has an unlimited right of appeal.</div></section>`}
const lab=[["A shopkeeper alleges a customer stole an expensive device.","Criminal","The central allegation is theft, an offence."],["Two siblings disagree over division of inherited property.","Civil","The central issue is a private property-rights dispute."],["A citizen argues that State action violates a Fundamental Right.","Constitutional","The issue raises constitutional-rights protection."],["A tenant says a landlord has wrongly retained a security deposit.","Civil","This is primarily a private claim/dispute."],["Police prosecute a person accused of assault.","Criminal","Assault is treated as a criminal offence."],["A public-interest group raises a serious environmental issue affecting a community.","PIL/Public interest","This may involve public-interest litigation, subject to court rules and maintainability."]];
function caseLab(){return `<section><h2>⚖️ Advanced Case Laboratory</h2><p>Classify each legal situation. The purpose is to apply concepts, not merely memorise definitions.</p><div id="lab"></div></section>`}
function drawLab(i=0){if(i>=lab.length){document.getElementById("lab").innerHTML='<div class="callout"><h3>🏅 Case Lab Complete</h3><p>You applied six judiciary concepts.</p></div>';return}let c=lab[i],opts=["Civil","Criminal","Constitutional","PIL/Public interest"];document.getElementById("lab").innerHTML=`<div class="card"><small>CASE ${i+1}/6</small><h3>${c[0]}</h3>${opts.map(o=>`<button class="answer labAns" data-v="${o}">${o}</button>`).join("")}<div id="labFeed"></div></div>`;document.querySelectorAll(".labAns").forEach(b=>b.onclick=()=>{let ok=b.dataset.v===c[1];if(ok)xp+=15;document.querySelectorAll(".labAns").forEach(x=>x.disabled=true);labFeed.innerHTML=`<div class="callout">${ok?"✅ Correct":"❌ Better classification: <b>"+c[1]+"</b>"}<br>${c[2]}<br><button id="nextLab" class="btn primary">Next case →</button></div>`;update();nextLab.onclick=()=>drawLab(i+1)})}
function compare(){return `<section><h2>🔍 Civil Law vs Criminal Law</h2><div style="overflow:auto"><table><tr><th>Feature</th><th>Civil</th><th>Criminal</th></tr><tr><td>Main focus</td><td>Rights, claims and disputes</td><td>Acts defined as offences</td></tr><tr><td>Examples</td><td>Property, rent, contract, family disputes</td><td>Theft, robbery, assault</td></tr><tr><td>Typical process</td><td>An affected party brings a claim before the appropriate court</td><td>Alleged offence may be investigated and prosecuted according to criminal procedure</td></tr><tr><td>Possible outcome</td><td>Orders, declarations, compensation or other civil remedies depending on law</td><td>Acquittal or, after conviction, punishment/sentence according to law</td></tr></table></div><div class="callout"><b>Harder idea:</b> A single event can sometimes create more than one kind of legal consequence. Classification depends on the legal issues involved.</div></section>`}
const glossaryTerms=[["Judiciary","The system of courts and judges."],["Jurisdiction","The legal authority of a court to hear and decide particular matters."],["Appeal","A request for review by a higher court where law permits."],["Judicial Review","Court examination of laws or government action for constitutional consistency."],["PIL","Public Interest Litigation."],["Fundamental Rights","Constitutionally guaranteed rights enforceable through appropriate legal remedies."],["Civil Law","Law dealing primarily with private rights, claims and disputes."],["Criminal Law","Law dealing with conduct defined as offences."],["Independent Judiciary","A judiciary able to decide according to law without improper outside pressure."],["Rule of Law","The principle that government and citizens are governed by law."],["Legal Aid","Legal assistance intended to improve access to justice for eligible persons."],["Constitutional Remedy","A judicial remedy used to enforce constitutional rights within the court's powers."]];
function glossaryPage(){return `<section><h2>📖 Judiciary Glossary</h2><div class="grid">${glossaryTerms.map(g=>`<div class="card"><h3>${g[0]}</h3><p>${g[1]}</p></div>`).join("")}</div></section>`}
function hardQuiz(){return `<section><h2>🏆 Judiciary Master Challenge</h2><p><b>30 questions</b> • More conceptual • Score 24+ for Judiciary Champion.</p><div id="quiz"></div></section>`}
function runQuiz(i=0,s=0){if(i===DATA.quiz.length){best=Math.max(best,s);xp+=s*3;update();quiz.innerHTML=`<div class="callout"><h2>${s>=27?"👑 Constitutional Expert":s>=24?"🏆 Judiciary Champion":s>=18?"🎓 Strong Learner":"📚 Keep Learning"}</h2><p>Final score: <b>${s}/30</b> (${Math.round(s/30*100)}%)</p><p>${s>=24?"Excellent command of the chapter.":"Review the detailed modules and try again."}</p><button class="btn primary" id="retry">Retake 30-question quiz</button></div>`;retry.onclick=()=>runQuiz();return}let q=DATA.quiz[i];quiz.innerHTML=`<div class="card"><small>QUESTION ${i+1} OF 30 • SCORE ${s}</small><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="answer q" data-j="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div>`;document.querySelectorAll(".q").forEach(b=>b.onclick=()=>runQuiz(i+1,s+(+b.dataset.j===q[2]?1:0)))}
function render(){update();app.innerHTML=[home,fullChapter,courts,caseLab,compare,glossaryPage,hardQuiz][page]();document.querySelectorAll(".jump").forEach(b=>b.onclick=()=>{page=+b.dataset.go;render()});if(page===1)document.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>{let i=+b.dataset.i,x=document.getElementById("lesson"+i);x.hidden=!x.hidden;if(!x.hidden&&!opened.has(i)){opened.add(i);xp+=5;update()}});if(page===2)document.querySelectorAll(".court").forEach(b=>b.onclick=()=>courtInfo.textContent=b.dataset.info);if(page===3)drawLab();if(page===6)runQuiz()}
render();
</script></body></html>
